{% extends "base.html" %}
{% block title %}Hyr në llogari{% endblock %}
{% block public_content %}
<div class="narrow">
  <h1>Hyr në llogari</h1>
  <p class="lead">Vazhdo aty ku e le studimin.</p>

  <form method="post" class="panel form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if errors.form %}<p class="form-error" role="alert">{{ errors.form }}</p>{% endif %}
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" value="{{ request.form.get('email', '') }}" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Fjalëkalimi</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="button" type="submit" data-loading="Po hyn…">Hyr</button>
  </form>

  <p class="after-form">Nuk ke llogari? <a href="{{ url_for('main.register') }}">Regjistrohu</a></p>
</div>
{% endblock %}
